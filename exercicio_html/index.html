<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício HTML - EBAC</title>
</head>
<body>

    <h1>Formulário de Cadastro</h1>

    <form action="#">
        <div>
            <label for="campo-nome">Nome:</label>
            <input type="text" id="campo-nome" placeholder="Digite seu nome completo" required>
        </div>
        <br>
        <div>
            <label for="campo-email">E-mail:</label>
            <input type="email" id="campo-email" placeholder="seu.email@exemplo.com" required>
        </div>
        <br>
        <div>
            <label for="campo-senha">Senha:</label>
            <input type="password" id="campo-senha" placeholder="Crie uma senha segura" required>
        </div>
        <br>
        <button type="submit">Realizar Cadastro</button>
    </form>

</body>
</html>
